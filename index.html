<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人财务BI看板</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
        --blue: #2563eb;
        --red: #dc2626;
        --green: #16a34a;
        --purple: #7c3aed;
        --amber: #d97706;
        --slate: #475569;
        --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 12px 32px rgba(15, 23, 42, 0.05);
        --radius: 8px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        overflow-x: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      }

      .app-shell {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        min-height: 100vh;
      }

      .sidebar {
        position: sticky;
        top: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        padding: 22px 16px;
        border-right: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(14px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 8px 20px;
        font-size: 18px;
        font-weight: 800;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: #eff6ff;
        color: var(--blue);
        font-size: 16px;
      }

      .nav-list {
        display: grid;
        gap: 4px;
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 42px;
        padding: 0 12px;
        border-radius: 8px;
        color: #334155;
        font-size: 14px;
        font-weight: 650;
      }

      .nav-item.active {
        background: #eff6ff;
        color: var(--blue);
      }

      .nav-icon {
        display: grid;
        place-items: center;
        width: 18px;
        color: currentColor;
        font-size: 15px;
      }

      .sidebar-status {
        margin-top: auto;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        color: var(--muted);
        font-size: 13px;
      }

      .status-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
        color: var(--text);
        font-weight: 650;
      }

      .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: var(--green);
      }

      .page {
        width: min(1480px, 100%);
        margin: 0 auto;
        padding: 28px 34px 30px;
      }

      .topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        line-height: 1.16;
        font-weight: 800;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .sync-pill {
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--muted);
        font-size: 13px;
      }

      .date-filter {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 46px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--card);
        color: var(--text);
        font-size: 14px;
        white-space: nowrap;
      }

      .date-filter select {
        width: 100%;
        min-width: 210px;
        border: 0;
        outline: 0;
        appearance: none;
        background: transparent;
        color: var(--text);
        font: inherit;
        text-align: center;
        cursor: pointer;
      }

      .date-filter svg {
        width: 20px;
        height: 20px;
        color: var(--blue);
      }

      .kpi-grid {
        display: grid;
        grid-template-columns: minmax(460px, 2.4fr) repeat(3, minmax(180px, 1fr));
        gap: 16px;
        margin-bottom: 22px;
      }

      .card {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--card);
        box-shadow: var(--shadow);
      }

      .kpi-card {
        min-height: 132px;
        padding: 18px;
      }

      .asset-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 168px;
        gap: 18px;
        min-height: 142px;
        padding: 22px;
      }

      .overview-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .overview-label {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .overview-badge {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 0 9px;
        border-radius: 999px;
        background: #eff6ff;
        color: var(--blue);
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }

      .kpi-title {
        margin: 0 0 10px;
        font-size: 13px;
        color: var(--muted);
        font-weight: 600;
      }

      .kpi-value {
        margin: 0;
        font-size: 30px;
        line-height: 1.1;
        font-weight: 800;
        letter-spacing: 0;
      }

      .asset-card .kpi-value {
        font-size: 42px;
      }

      .metric-card {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .asset-mini-chart {
        width: 100%;
        height: 108px;
        align-self: end;
      }

      .asset-mini-chart svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .spark-area {
        fill: rgba(37, 99, 235, 0.09);
      }

      .spark-line {
        fill: none;
        stroke: var(--blue);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .kpi-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 14px;
        font-size: 13px;
        color: var(--muted);
      }

      .kpi-meta strong {
        font-weight: 800;
      }

      .blue {
        color: var(--blue);
      }

      .red {
        color: var(--red);
      }

      .green {
        color: var(--green);
      }

      .purple {
        color: var(--purple);
      }

      .orange {
        color: var(--amber);
      }

      .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        align-items: start;
        gap: 16px;
        margin-bottom: 22px;
      }

      .progress-panel {
        grid-column: span 8;
      }

      .accounts {
        grid-column: span 4;
      }

      .monthly-panel {
        grid-column: span 6;
      }

      .category-panel {
        grid-column: span 6;
      }

      .detail-panel {
        grid-column: 1 / -1;
      }

      .panel {
        min-height: 0;
        padding: 18px 20px;
      }

      .panel h2 {
        margin: 0 0 12px;
        font-size: 20px;
        line-height: 1.2;
        font-weight: 800;
      }

      .chart {
        width: 100%;
        height: 280px;
      }

      .wide-chart {
        height: 318px;
      }

      .accounts {
        padding: 18px 20px;
      }

      .account-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 15px;
      }

      .account-summary {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin: 4px 0 16px;
      }

      .account-pill {
        padding: 12px;
        border: 1px solid #d9e5f2;
        border-radius: 8px;
        background: #f8fafc;
      }

      .account-pill span {
        display: block;
        color: var(--muted);
        font-size: 13px;
      }

      .account-pill strong {
        display: block;
        margin-top: 5px;
        color: var(--blue);
        font-size: 18px;
      }

      .account-table th,
      .account-table td {
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }

      .account-table th {
        color: #64748b;
        font-weight: 500;
      }

      .account-table td:last-child,
      .account-table th:last-child {
        text-align: right;
      }

      .account-total td {
        border-bottom: 0;
        color: var(--blue);
        font-size: 18px;
        font-weight: 800;
      }

      .detail-table-wrap {
        overflow: auto;
      }

      .detail-table {
        width: 100%;
        min-width: 760px;
        border-collapse: collapse;
        overflow: hidden;
        border-radius: 6px;
        font-size: 14px;
      }

      .detail-table th {
        padding: 10px 12px;
        background: #f8fafc;
        color: var(--muted);
        text-align: center;
        font-weight: 700;
        border-bottom: 1px solid var(--line);
      }

      .detail-table th:first-child {
        text-align: left;
      }

      .detail-table td {
        padding: 11px 12px;
        border-bottom: 1px solid var(--line);
        text-align: center;
        background: #ffffff;
      }

      .detail-table td:first-child {
        text-align: left;
      }

      .detail-table tfoot td {
        font-size: 16px;
        font-weight: 800;
        background: #f8fafc;
      }

      .note {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 66px;
        margin-top: 18px;
        padding: 0 26px;
        border: 1px solid #b7d6ff;
        border-radius: var(--radius);
        background: #ffffff;
        color: var(--muted);
        font-size: 14px;
      }

      .note svg {
        width: 23px;
        height: 23px;
        color: var(--blue);
        flex: 0 0 auto;
      }

      .state {
        padding: 26px;
        color: var(--muted);
        font-size: 15px;
      }

      @media (max-width: 1320px) {
        .app-shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          display: none;
        }

        .kpi-grid {
          grid-template-columns: repeat(2, minmax(210px, 1fr));
        }

        .asset-card {
          grid-column: 1 / -1;
        }

        .dashboard-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .monthly-panel,
        .category-panel,
        .detail-panel,
        .progress-panel,
        .accounts {
          grid-column: auto;
          grid-row: auto;
        }
      }

      @media (max-width: 760px) {
        .page {
          padding: 16px;
        }

        .topbar {
          flex-direction: column;
        }

        .top-actions {
          width: 100%;
          flex-direction: column;
          align-items: stretch;
        }

        h1 {
          font-size: 26px;
        }

        .date-filter {
          width: 100%;
          justify-content: space-between;
          white-space: normal;
        }

        .date-filter select {
          min-width: 0;
        }

        .kpi-grid {
          grid-template-columns: 1fr;
          gap: 14px;
        }

        .kpi-card {
          min-height: 132px;
        }

        .panel {
          padding: 16px 12px;
        }

        .panel h2 {
          font-size: 19px;
          padding: 0 4px;
        }

        .chart,
        .wide-chart,
        #monthlyChart {
          height: 310px;
        }

        .dashboard-grid {
          grid-template-columns: 1fr;
        }

        .monthly-panel,
        .category-panel,
        .detail-panel,
        .progress-panel,
        .accounts {
          grid-column: 1;
        }

        .asset-card {
          grid-template-columns: 1fr;
        }

        .account-summary {
          grid-template-columns: 1fr;
        }

        .note {
          align-items: flex-start;
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <div class="brand">
          <span class="brand-mark">◇</span>
          <span>个人财务看板</span>
        </div>
        <nav class="nav-list">
          <div class="nav-item active"><span class="nav-icon">⌂</span><span>概览</span></div>
          <div class="nav-item"><span class="nav-icon">↔</span><span>资金流水</span></div>
          <div class="nav-item"><span class="nav-icon">◎</span><span>预算管理</span></div>
          <div class="nav-item"><span class="nav-icon">◫</span><span>账户管理</span></div>
          <div class="nav-item"><span class="nav-icon">▦</span><span>分类管理</span></div>
          <div class="nav-item"><span class="nav-icon">▤</span><span>报表中心</span></div>
          <div class="nav-item"><span class="nav-icon">◉</span><span>目标设置</span></div>
          <div class="nav-item"><span class="nav-icon">↻</span><span>数据同步</span></div>
          <div class="nav-item"><span class="nav-icon">⚙</span><span>设置</span></div>
        </nav>
        <div class="sidebar-status">
          <div class="status-row"><span class="status-dot"></span><span>已同步</span></div>
          <div>刚刚更新</div>
        </div>
      </aside>

      <main class="page">
      <header class="topbar">
        <div>
          <h1>个人财务看板</h1>
          <p class="subtitle">资产增长与存款进度</p>
        </div>
        <div class="top-actions">
          <span class="sync-pill" id="syncStatus">正在同步</span>
          <label class="date-filter" aria-label="月份筛选">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2"></rect>
              <path d="M16 2v4M8 2v4M3 10h18"></path>
            </svg>
            <select id="monthFilter" aria-label="月份筛选">
              <option value="all">加载中</option>
            </select>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m6 9 6 6 6-6"></path>
            </svg>
          </label>
        </div>
      </header>

      <section class="kpi-grid" id="kpiGrid"></section>

      <section class="dashboard-grid">
        <article class="card panel progress-panel">
          <h2>年度存款进度</h2>
          <div class="chart wide-chart" id="balanceChart"></div>
        </article>

        <article class="card accounts">
          <h2>资产账户构成</h2>
          <div class="account-summary" id="accountSummary"></div>
          <table class="account-table">
            <thead>
              <tr>
                <th>账户</th>
                <th>结余</th>
              </tr>
            </thead>
            <tbody id="accountsBody"></tbody>
          </table>
        </article>

        <article class="card panel monthly-panel">
          <h2>收入 / 支出 / 存款趋势</h2>
          <div class="chart" id="monthlyChart"></div>
        </article>

        <article class="card panel category-panel">
          <h2>支出 Top 类目 (合计 <span id="expenseTotal">0</span>)</h2>
          <div class="chart" id="categoryChart"></div>
        </article>

        <article class="card panel detail-panel">
          <h2>月度明细</h2>
          <div class="detail-table-wrap">
            <table class="detail-table">
              <thead>
                <tr>
                  <th>月份</th>
                  <th>实际收入</th>
                  <th>实际支出</th>
                  <th>实际存款</th>
                  <th>完成率</th>
                  <th>较目标存款</th>
                </tr>
              </thead>
              <tbody id="detailBody"></tbody>
              <tfoot id="detailFoot"></tfoot>
            </table>
          </div>
        </article>
      </section>

      <footer class="note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 16v-4M12 8h.01"></path>
        </svg>
        <span>小贴士：存款完成率 = 实际存款 ÷ 目标存款；收支结余 = 实际收入 - 实际支出；较目标存款 = 实际存款 - 目标存款</span>
      </footer>
      </main>
    </div>

    <script>
      const CSV_URL = "/api/data";
      const EXCHANGE_RATE_URL = "/api/rates";
      const DIRECT_CSV_URL =
        "https://docs.google.com/spreadsheets/d/1TzNIHcOvIC4uhMi2rqJ9xP1kRFco7c4OKhxE5Woylro/gviz/tq?tqx=out:csv&gid=504817751";
      const DIRECT_EXCHANGE_RATE_URL = "https://open.er-api.com/v6/latest/USD";

      const DEFAULT_CSV = `月份,目标收入,目标支出,目标存款,实际收入,实际支出,实际存款,存款完成率,偏差,,月份,越南盾兑换,支出,结余（越南盾 单位万）,结余（usdt 单位U）,结余（visa 单位美元）
2026-04,5305,2500,2805,5525,2673,5352,190.80%,2547,,2026-04,2600,1990,610,5439,260
2026-05,4755,2500,2255,,,0,0.00%,-2255,,2026-05,,,0
2026-06,4695,2500,2195,,,0,0.00%,-2195,,2026-06,,,0
2026-07,4635,2500,2135,,,0,0.00%,-2135,,2026-07,,,0
2026-08,4575,2500,2075,,,0,0.00%,-2075,,2026-08,,,0
2026-09,4515,2500,2015,,,0,0.00%,-2015,,2026-09,,,0
2026-10,4455,2500,1955,,,0,0.00%,-1955,,2026-10,,,0
2026-11,4395,2500,1895,,,0,0.00%,-1895,,2026-11,,,0
2026-12,4335,2500,1835,,,0,0.00%,-1835,,2026-12,,,0
合计,41665,22500,19165,5525,2673,5352,27.93%,-13813,,合计,2600,1990,610,5439,260`;

      const FALLBACK_CATEGORIES = [
        { name: "越南盾兑换", value: 1520 },
        { name: "房租", value: 500 },
        { name: "餐饮", value: 200 },
        { name: "交通", value: 140 },
        { name: "订阅/软件", value: 80 },
        { name: "购物", value: 60 },
        { name: "娱乐", value: 40 },
      ];

      const FALLBACK_ACCOUNTS = [
        { name: "越南盾", value: 1030 },
        { name: "现金", value: 0 },
        { name: "银行卡", value: 0 },
        { name: "Visa", value: 0 },
      ];

      const colorMap = {
        income: "#2563eb",
        expense: "#dc2626",
        saving: "#16a34a",
        target: "#94a3b8",
        neutral: "#64748b",
        amber: "#d97706",
      };

      const charts = {};
      let dashboardData = null;
      let selectedMonth = "all";
      let exchangeRates = null;

      init();

      async function init() {
        try {
          const [rows, rates] = await Promise.all([fetchCsvRows(CSV_URL), fetchExchangeRates()]);
          exchangeRates = rates;
          const data = parseDashboardData(rows);
          setSyncStatus("已同步 · 刚刚");
          renderDashboard(data);
        } catch (error) {
          document.body.insertAdjacentHTML(
            "afterbegin",
            `<div class="state">实时数据读取失败，当前显示内置快照：${error.message}</div>`,
          );
          setSyncStatus("内置快照");
          renderDashboard(parseDashboardData(parseCsv(DEFAULT_CSV)));
        }
      }

      function setSyncStatus(text) {
        const element = document.getElementById("syncStatus");
        if (element) element.textContent = text;
      }

      async function fetchCsvRows(url) {
        try {
          const text = await fetchTextWithCacheBust(url);
          return parseCsv(text);
        } catch (error) {
          if (url !== DIRECT_CSV_URL) {
            const text = await fetchTextWithCacheBust(DIRECT_CSV_URL);
            return parseCsv(text);
          }
          throw error;
        }
      }

      async function fetchExchangeRates() {
        try {
          return normalizeExchangeRates(await fetchJsonWithCacheBust(EXCHANGE_RATE_URL));
        } catch (error) {
          try {
            return normalizeExchangeRates(await fetchJsonWithCacheBust(DIRECT_EXCHANGE_RATE_URL));
          } catch (fallbackError) {
            console.warn("Exchange rate fetch failed", fallbackError);
            return null;
          }
        }
      }

      async function fetchTextWithCacheBust(url) {
        const separator = url.includes("?") ? "&" : "?";
        const response = await fetch(`${url}${separator}cacheBust=${Date.now()}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.text();
      }

      async function fetchJsonWithCacheBust(url) {
        const text = await fetchTextWithCacheBust(url);
        return JSON.parse(text);
      }

      function normalizeExchangeRates(data) {
        if (data.result !== "success" || !data.rates?.CNY || !data.rates?.VND) {
          throw new Error("rates missing");
        }
        return {
          cnyPerUsd: data.rates.CNY,
          vndPerUsd: data.rates.VND,
          updatedAt: data.time_last_update_utc,
        };
      }

      function parseCsv(text) {
        const rows = [];
        let row = [];
        let cell = "";
        let quoted = false;

        for (let index = 0; index < text.length; index += 1) {
          const char = text[index];
          const next = text[index + 1];

          if (char === '"' && quoted && next === '"') {
            cell += '"';
            index += 1;
          } else if (char === '"') {
            quoted = !quoted;
          } else if (char === "," && !quoted) {
            row.push(cell);
            cell = "";
          } else if ((char === "\n" || char === "\r") && !quoted) {
            if (char === "\r" && next === "\n") index += 1;
            row.push(cell);
            rows.push(row);
            row = [];
            cell = "";
          } else {
            cell += char;
          }
        }

        if (cell || row.length) {
          row.push(cell);
          rows.push(row);
        }

        return rows.filter((item) => item.some((value) => value.trim() !== ""));
      }

      function parseDashboardData(rows) {
        const body = rows.slice(1);
        const monthly = [];
        const currencyRows = [];
        let total = null;
        let currencyTotal = null;

        body.forEach((row) => {
          const month = clean(row[0]);
          const currency = {
            month: clean(row[10]),
            exchange: toNumber(row[11]),
            expense: toNumber(row[12]),
            vndBalance: toNumber(row[13]),
            usdtBalance: toNumber(row[14]),
            visaBalance: toNumber(row[15]),
          };
          const hasCurrencyValue =
            currency.exchange || currency.expense || currency.vndBalance || currency.usdtBalance || currency.visaBalance;

          if (hasCurrencyValue) {
            if (currency.month && currency.month !== "合计") {
              currencyRows.push(currency);
            } else {
              currencyTotal = currency;
            }
          }

          if (!month) return;

          const income = toNumber(row[4]);
          const expense = toNumber(row[5]);
          const targetSaving = toNumber(row[3]);
          const saving = toNumber(row[6]);
          const netBalance = income - expense;
          const entry = {
            month,
            targetIncome: toNumber(row[1]),
            targetExpense: toNumber(row[2]),
            targetSaving,
            income,
            expense,
            saving,
            savingRate: toRate(row[7]),
            netBalance,
            variance: saving - targetSaving,
          };

          if (month === "合计") {
            total = entry;
          } else {
            monthly.push(entry);
          }
        });

        const calculatedTotal = total || {
          ...buildTotal(monthly),
        };
        calculatedTotal.savingRate =
          calculatedTotal.targetSaving > 0
            ? calculatedTotal.saving / calculatedTotal.targetSaving
            : 0;

        const latestActual = [...monthly].reverse().find((row) => row.income || row.expense || row.saving) || monthly[0];
        const latestCurrency = currencyTotal || [...currencyRows].reverse().find(
          (row) => row.exchange || row.expense || row.vndBalance || row.usdtBalance || row.visaBalance,
        );
        const categories = latestCurrency
          ? [
              { name: "越南盾兑换", value: latestCurrency.exchange },
              { name: "支出", value: latestCurrency.expense },
              { name: "越南盾结余", value: latestCurrency.vndBalance },
            ].filter((item) => item.value > 0)
          : FALLBACK_CATEGORIES;

        const accounts = latestCurrency
          ? [
              { name: "越南盾", value: latestCurrency.vndBalance, unit: "万" },
              { name: "USDT", value: latestCurrency.usdtBalance, unit: "U" },
              { name: "Visa", value: latestCurrency.visaBalance, unit: "美元" },
            ]
          : FALLBACK_ACCOUNTS;

        return {
          monthly,
          currencyRows,
          total: calculatedTotal,
          latestActual,
          categories: categories.length ? categories : FALLBACK_CATEGORIES,
          accounts,
        };
      }

      function buildTotal(rows) {
        const total = {
          month: "合计",
          targetIncome: sum(rows, "targetIncome"),
          targetExpense: sum(rows, "targetExpense"),
          targetSaving: sum(rows, "targetSaving"),
          income: sum(rows, "income"),
          expense: sum(rows, "expense"),
          saving: sum(rows, "saving"),
          netBalance: sum(rows, "netBalance"),
          variance: sum(rows, "variance"),
        };
        total.savingRate = total.targetSaving > 0 ? total.saving / total.targetSaving : 0;
        return total;
      }

      function buildScopedMoney(data, month) {
        if (month === "all") {
          return { categories: data.categories, accounts: data.accounts };
        }

        const row = data.currencyRows.find((item) => item.month === month);
        if (!row) {
          return { categories: FALLBACK_CATEGORIES, accounts: FALLBACK_ACCOUNTS };
        }

        const categories = [
          { name: "越南盾兑换", value: row.exchange },
          { name: "支出", value: row.expense },
          { name: "越南盾结余", value: row.vndBalance },
        ].filter((item) => item.value > 0);

        return {
          categories,
          accounts: [
            { name: "越南盾", value: row.vndBalance, unit: "万" },
            { name: "USDT", value: row.usdtBalance, unit: "U" },
            { name: "Visa", value: row.visaBalance, unit: "美元" },
          ],
        };
      }

      function renderDashboard(data) {
        dashboardData = data;
        renderMonthFilter(data.monthly);
        renderFilteredDashboard();
        window.addEventListener("resize", resizeCharts);
      }

      function renderFilteredDashboard() {
        const visibleMonthly =
          selectedMonth === "all"
            ? dashboardData.monthly
            : dashboardData.monthly.filter((row) => row.month === selectedMonth);
        const scopedTotal = buildTotal(visibleMonthly);
        const scopedMoney = buildScopedMoney(dashboardData, selectedMonth);
        const scopedData = {
          ...dashboardData,
          monthly: visibleMonthly,
          total: selectedMonth === "all" ? dashboardData.total : scopedTotal,
          latestActual:
            selectedMonth === "all"
              ? dashboardData.total
              : visibleMonthly[0] || dashboardData.latestActual,
          categories: scopedMoney.categories,
          accounts: scopedMoney.accounts,
        };

        renderKpis(scopedData);
        renderMonthlyChart(visibleMonthly);
        renderCategoryChart(scopedData.categories);
        renderAccounts(scopedData.accounts);
        renderDetailTable(visibleMonthly, scopedData.total);
        renderBalanceChart(visibleMonthly);
      }

      function renderMonthFilter(monthly) {
        const first = monthly[0]?.month || "2026-04";
        const last = monthly[monthly.length - 1]?.month || "2026-12";
        const select = document.getElementById("monthFilter");
        select.innerHTML = [
          `<option value="all">${first}/01 - ${monthEnd(last)}</option>`,
          ...monthly.map((row) => `<option value="${row.month}">${row.month}</option>`),
        ].join("");
        select.value = selectedMonth;
        select.addEventListener("change", (event) => {
          selectedMonth = event.target.value;
          renderFilteredDashboard();
        });
      }

      function renderKpis(data) {
        const current = data.latestActual || data.monthly[0] || {};
        const completion = rate(current.saving, current.targetSaving);
        const rmbTotal = calculateRmbTotal(data.accounts);
        const assetValue = rmbTotal === null ? formatNumber(current.saving) : `¥${formatNumber(rmbTotal)}`;
        const varianceClass = current.variance >= 0 ? "green" : "red";
        const cards = [
          {
            title: "年度存款完成率",
            value: formatPercent(completion),
            meta: `目标 100% · ${completion >= 1 ? "已达标" : "推进中"}`,
            color: completion >= 1 ? "green" : "blue",
            raw: true,
          },
          {
            title: "实际存款",
            value: current.saving,
            meta: `目标 ${formatNumber(current.targetSaving)}`,
            color: "green",
          },
          {
            title: "较目标存款",
            value: formatSigned(current.variance),
            meta: "实际存款 - 目标存款",
            color: varianceClass,
            raw: true,
          },
        ];

        document.getElementById("kpiGrid").innerHTML = `
          <article class="card kpi-card asset-card">
            <div>
              <p class="kpi-title">当前资产折合人民币</p>
              <p class="kpi-value blue">${assetValue}</p>
              <div class="kpi-meta">
                <span>年度存款完成率 <strong class="blue">${formatPercent(completion)}</strong></span>
                <span>较目标 <strong class="${varianceClass}">${formatSigned(current.variance)}</strong></span>
              </div>
            </div>
            <div class="asset-mini-chart">${sparklineSvg(data.monthly.map((row) => row.saving))}</div>
          </article>
          ${cards
            .map(
              (card) => `
                <article class="card kpi-card metric-card">
                  <div>
                    <p class="kpi-title">${card.title}</p>
                    <p class="kpi-value ${card.color}">${card.raw ? card.value : formatNumber(card.value)}</p>
                  </div>
                  <div class="kpi-meta">
                    <span>${card.meta}</span>
                  </div>
                </article>`,
            )
            .join("")}`;
      }

      function renderMonthlyChart(monthly) {
        const chart = getChart("monthlyChart");
        const compact = isCompact();
        chart.setOption({
          color: [colorMap.income, colorMap.expense, colorMap.saving],
          tooltip: { trigger: "axis" },
          legend: { top: 4, data: ["实际收入", "实际支出", "实际存款"] },
          grid: { left: compact ? 48 : 54, right: 18, top: 58, bottom: compact ? 46 : 34 },
          xAxis: {
            type: "category",
            data: monthly.map((row) => row.month),
            axisTick: { show: false },
            axisLabel: { interval: compact ? "auto" : 0 },
          },
          yAxis: { type: "value", splitLine: { lineStyle: { color: "#edf2f7" } } },
          series: [
            lineSeries("实际收入", monthly.map((row) => row.income), colorMap.income),
            lineSeries("实际支出", monthly.map((row) => row.expense), colorMap.expense),
            lineSeries("实际存款", monthly.map((row) => row.saving), colorMap.saving),
          ],
        });
      }

      function renderCategoryChart(categories) {
        const ranked = [...categories].sort((a, b) => b.value - a.value).slice(0, 6);
        const total = categories.reduce((amount, item) => amount + item.value, 0);
        document.getElementById("expenseTotal").textContent = formatNumber(total);
        const chart = getChart("categoryChart");
        chart.setOption({
          color: [colorMap.blue || colorMap.income],
          tooltip: {
            trigger: "axis",
            axisPointer: { type: "shadow" },
            formatter(items) {
              const item = items[0];
              const percent = total ? ((item.value / total) * 100).toFixed(1) : "0.0";
              return `${item.name}<br/>${formatNumber(item.value)} (${percent}%)`;
            },
          },
          graphic: ranked.length
            ? []
            : [
                {
                  type: "text",
                  left: "center",
                  top: "middle",
                  style: { text: "暂无数据", fill: "#64748b", fontSize: 16, fontWeight: 600 },
                },
              ],
          grid: { left: 94, right: 42, top: 16, bottom: 24 },
          xAxis: {
            type: "value",
            axisLabel: { color: "#64748b" },
            splitLine: { lineStyle: { color: "#edf2f7" } },
          },
          yAxis: {
            type: "category",
            inverse: true,
            data: ranked.map((item) => item.name),
            axisTick: { show: false },
            axisLabel: { color: "#0f172a" },
          },
          series: [
            {
              type: "bar",
              barWidth: 16,
              itemStyle: { borderRadius: [0, 4, 4, 0], color: colorMap.income },
              label: {
                show: true,
                position: "right",
                color: "#64748b",
                formatter: ({ value }) => formatNumber(value),
              },
              data: ranked.map((item) => item.value),
            },
          ],
        });
      }

      function renderAccounts(accounts) {
        const rmbTotal = calculateRmbTotal(accounts);
        document.getElementById("accountSummary").innerHTML = accounts.length
          ? [
              ...accounts.map(
                (account) => `
                  <div class="account-pill">
                    <span>${account.name}</span>
                    <strong>${formatAccountValue(account)}</strong>
                  </div>`,
              ),
              `
                <div class="account-pill">
                  <span>折合人民币</span>
                  <strong>${rmbTotal === null ? "汇率读取失败" : `¥${formatNumber(rmbTotal)}`}</strong>
                </div>`,
            ].join("")
          : `<div class="account-pill"><span>账户</span><strong>暂无数据</strong></div>`;
        document.getElementById("accountsBody").innerHTML = `${accounts
          .map(
            (account) => `
              <tr>
                <td>${account.name}</td>
                <td>${formatAccountValue(account)}</td>
              </tr>`,
          )
          .join("")}
          <tr class="account-total">
            <td>折合人民币</td>
            <td>${rmbTotal === null ? "汇率读取失败" : `¥${formatNumber(rmbTotal)}`}</td>
          </tr>`;
      }

      function renderDetailTable(monthly, total) {
        document.getElementById("detailBody").innerHTML = monthly
          .map(
            (row) => `
              <tr>
                <td>${row.month}</td>
                <td>${formatNumber(row.income)}</td>
                <td>${formatNumber(row.expense)}</td>
                <td>${formatNumber(row.saving)}</td>
                <td class="${row.savingRate >= 1 ? "green" : "green"}">${formatPercent(row.savingRate)}</td>
                <td class="${row.variance >= 0 ? "green" : "red"}">${formatSigned(row.variance)}</td>
              </tr>`,
          )
          .join("");
        document.getElementById("detailFoot").innerHTML = `
          <tr>
            <td>合计</td>
            <td>${formatNumber(total.income)}</td>
            <td>${formatNumber(total.expense)}</td>
            <td>${formatNumber(total.saving)}</td>
            <td class="green">${formatPercent(total.savingRate)}</td>
            <td class="${total.variance >= 0 ? "green" : "red"}">${formatSigned(total.variance)}</td>
          </tr>`;
      }

      function renderBalanceChart(monthly) {
        const chart = getChart("balanceChart");
        const compact = isCompact();
        let cumulativeSaving = 0;
        let cumulativeTarget = 0;
        const cumulativeData = monthly.map((row) => {
          cumulativeSaving += row.saving;
          return cumulativeSaving;
        });
        const targetData = monthly.map((row) => {
          cumulativeTarget += row.targetSaving;
          return cumulativeTarget;
        });

        chart.setOption({
          color: [colorMap.saving, colorMap.income, colorMap.target],
          tooltip: { trigger: "axis" },
          legend: { top: 4, data: ["实际存款", "累计存款", "目标进度"] },
          grid: { left: compact ? 48 : 54, right: compact ? 16 : 34, top: 62, bottom: compact ? 46 : 36 },
          xAxis: {
            type: "category",
            data: monthly.map((row) => row.month),
            axisTick: { show: false },
            axisLabel: { interval: compact ? "auto" : 0 },
          },
          yAxis: { type: "value", splitLine: { lineStyle: { color: "#edf2f7" } } },
          series: [
            {
              name: "实际存款",
              type: "bar",
              barWidth: compact ? 16 : 24,
              itemStyle: { color: colorMap.saving, borderRadius: [4, 4, 0, 0] },
              label: {
                show: !compact,
                position: "top",
                formatter: ({ value }) => formatNumber(value),
                color: colorMap.saving,
                fontWeight: 800,
              },
              data: monthly.map((row) => row.saving),
            },
            {
              name: "累计存款",
              type: "line",
              symbolSize: 8,
              lineStyle: { width: 3, color: colorMap.income },
              label: {
                show: !compact,
                position: "top",
                offset: [0, -8],
                formatter: ({ value }) => formatNumber(value),
                color: colorMap.income,
              },
              data: cumulativeData,
            },
            {
              name: "目标进度",
              type: "line",
              symbol: "none",
              lineStyle: { width: 2, type: "dashed", color: colorMap.target },
              data: targetData,
            },
          ],
        });
      }

      function lineSeries(name, data, color) {
        return {
          name,
          type: "line",
          symbolSize: 8,
          lineStyle: { width: 3 },
          labelLayout: { hideOverlap: true },
          label: {
            show: false,
            color,
            fontWeight: 800,
            backgroundColor: "rgba(255,255,255,0.86)",
            borderRadius: 4,
            padding: [2, 4],
            formatter: ({ value }) => (Number(value) ? formatNumber(value) : ""),
          },
          data,
        };
      }

      function sparklineSvg(values) {
        const data = values.length ? values : [0];
        const width = 156;
        const height = 96;
        const padding = 8;
        const max = Math.max(...data, 1);
        const min = Math.min(...data, 0);
        const range = Math.max(max - min, 1);
        const points = data.map((value, index) => {
          const x = padding + (index / Math.max(data.length - 1, 1)) * (width - padding * 2);
          const y = height - padding - ((value - min) / range) * (height - padding * 2);
          return [x, y];
        });
        const line = points.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
        const area = `${padding},${height - padding} ${line} ${width - padding},${height - padding}`;
        return `
          <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="存款趋势">
            <polyline class="spark-area" points="${area}"></polyline>
            <polyline class="spark-line" points="${line}"></polyline>
          </svg>`;
      }

      function getChart(id) {
        if (!charts[id]) charts[id] = echarts.init(document.getElementById(id));
        return charts[id];
      }

      function resizeCharts() {
        renderFilteredDashboard();
        Object.values(charts).forEach((chart) => chart.resize());
      }

      function isCompact() {
        return window.matchMedia("(max-width: 760px)").matches;
      }

      function clean(value) {
        return String(value || "").trim();
      }

      function toNumber(value) {
        const parsed = Number(String(value || "").replace(/[%,$,\s]/g, ""));
        return Number.isFinite(parsed) ? parsed : 0;
      }

      function toRate(value) {
        const raw = clean(value);
        if (!raw) return 0;
        return raw.includes("%") ? toNumber(raw) / 100 : toNumber(raw);
      }

      function sum(rows, key) {
        return rows.reduce((amount, row) => amount + (Number(row[key]) || 0), 0);
      }

      function rate(value, target) {
        return target > 0 ? value / target : 0;
      }

      function formatNumber(value) {
        return Math.round(Number(value) || 0).toLocaleString("zh-CN");
      }

      function formatAccountValue(account) {
        const suffix = account.unit ? ` ${account.unit}` : "";
        return `${formatNumber(account.value)}${suffix}`;
      }

      function calculateRmbTotal(accounts) {
        if (!exchangeRates || !accounts.length) return null;
        return accounts.reduce((total, account) => total + accountToRmb(account), 0);
      }

      function accountToRmb(account) {
        const value = Number(account.value) || 0;
        if (account.name === "越南盾") {
          const vndAmount = value * 10000;
          return (vndAmount / exchangeRates.vndPerUsd) * exchangeRates.cnyPerUsd;
        }
        if (account.name === "USDT" || account.name === "Visa") {
          return value * exchangeRates.cnyPerUsd;
        }
        return 0;
      }

      function formatSigned(value) {
        const number = Number(value) || 0;
        return `${number > 0 ? "+" : ""}${formatNumber(number)}`;
      }

      function formatPercent(value) {
        return `${((Number(value) || 0) * 100).toFixed(2)}%`;
      }

      function monthEnd(month) {
        const [year, monthNumber] = month.split("-").map(Number);
        const date = new Date(year, monthNumber, 0);
        return `${year}/${String(monthNumber).padStart(2, "0")}/${String(date.getDate()).padStart(2, "0")}`;
      }

      function walletIcon() {
        return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6.5A3.5 3.5 0 0 1 7.5 3H18a1 1 0 1 1 0 2H7.5a1.5 1.5 0 0 0 0 3H19a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V6.5h2Zm14 8a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/></svg>`;
      }

      function downIcon() {
        return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 4a1 1 0 0 1 2 0v10.59l3.3-3.3a1 1 0 1 1 1.4 1.42l-5 5a1 1 0 0 1-1.4 0l-5-5a1 1 0 1 1 1.4-1.42l3.3 3.3V4Z"/><path d="M5 19a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H6a1 1 0 0 1-1-1Z"/></svg>`;
      }

      function pigIcon() {
        return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 9.5A5.5 5.5 0 0 1 12.5 4H15a5 5 0 0 1 4.8 3.6l1.2.4a1.5 1.5 0 0 1 1 1.42v2.16a1.5 1.5 0 0 1-1 1.42l-1.07.36A5.02 5.02 0 0 1 17 16.9V19a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-1h-2v1a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1v-2.2A5.5 5.5 0 0 1 7 9.5Zm4-2.5a1 1 0 1 0 0 2h3a1 1 0 1 0 0-2h-3Zm7 3a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z"/></svg>`;
      }

      function trendIcon() {
        return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 17a1 1 0 0 1-.7-1.7l5-5a1 1 0 0 1 1.4 0l2.3 2.29L18.59 6H16a1 1 0 1 1 0-2h5a1 1 0 0 1 1 1v5a1 1 0 1 1-2 0V7.41l-7.3 7.3a1 1 0 0 1-1.4 0L9 12.41l-4.3 4.3A1 1 0 0 1 4 17Z"/></svg>`;
      }

      function yenIcon() {
        return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm3.7 5.7L13.4 12H16a1 1 0 1 1 0 2h-3v1h3a1 1 0 1 1 0 2h-3v1a1 1 0 1 1-2 0v-1H8a1 1 0 1 1 0-2h3v-1H8a1 1 0 1 1 0-2h2.6L8.3 8.7a1 1 0 0 1 1.4-1.4L12 9.6l2.3-2.3a1 1 0 1 1 1.4 1.4Z"/></svg>`;
      }
    </script>
  </body>
</html>
